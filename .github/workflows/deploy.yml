# Publication automatique sur GitHub Pages.
# - Version officielle : branche main  → https://cyrilledehalleux-cmd.github.io/testantidote/
# - Version de test    : branche staging (si elle existe) → …/testantidote/staging/
# Si « npm run check » ou les tests échouent sur main, rien n'est publié (la version précédente reste en ligne)
# et la croix rouge dans l'onglet « Actions » explique l'erreur. Une erreur dans la version de test
# n'empêche pas la publication de la version officielle (la version de test est alors absente).
name: Publier la démo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier le contenu (titres, tableaux, sections FR/EN…)
        run: npm run check
      - name: Tests des calculateurs
        run: npm test
      - name: Construire l'application (version officielle)
        run: npm run build

      - name: Version de test – la branche staging existe-t-elle ?
        id: staging
        run: |
          if git ls-remote --exit-code --heads origin staging >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.staging.outputs.exists == 'true'
        with:
          ref: staging
          path: staging-src
      - name: Construire la version de test (…/staging/)
        if: steps.staging.outputs.exists == 'true'
        continue-on-error: true
        working-directory: staging-src
        run: |
          npm ci
          npm run check
          npm test
          STAGING=1 npm run build
          cp -r dist ../dist/staging

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
