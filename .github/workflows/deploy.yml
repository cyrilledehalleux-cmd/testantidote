# Publication automatique sur GitHub Pages à chaque modification de la branche main.
# Si « npm run check » trouve une erreur de mise en forme, rien n'est publié
# (la version précédente reste en ligne) et la croix rouge dans l'onglet « Actions » explique l'erreur.
name: Publier la démo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier le contenu (titres, tableaux, sections FR/EN…)
        run: npm run check
      - name: Tests du calculateur
        run: npm test
      - name: Construire l'application
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
